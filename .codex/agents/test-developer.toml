name = "test_developer"
description = "测试开发代理，负责测试脚本开发、调试、维护和问题排查。支持API自动化(pytest)、UI自动化(Playwright)、性能测试(Locust)和安全测试脚本的开发、调试和修复。"
model = "gpt-5.4"
