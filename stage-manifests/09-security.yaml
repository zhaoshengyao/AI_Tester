stage_id: 9-security
display_name: 9.安全测试
driver_type: script
required_inputs:
  - name: reviewed-security-case
    paths:
      - docs/cases/安全测试用例-评审版.md
    match: all
    path_type: file
required_outputs:
  - name: security-raw-report
    paths:
      - tests/security/reports
    match: all
    path_type: dir
  - name: security-formal-report
    paths:
      - docs/test-runs/{run_id}/reports/安全测试报告.md
    match: all
    path_type: file
    must_reference_run_id: true
  - name: security-defect-doc
    paths:
      - docs/test-runs/{run_id}/defects/安全缺陷清单.md
    match: all
    path_type: file
    must_reference_run_id: true
required_gates:
  - name: zap-and-scope-gates
    gate_type: external
    description: ZAP、认证上下文和扫描范围由脚本执行期校验。
archive_requirements:
  requires_run_archive: true
  required_subdirs:
    - reports
    - defects
    - raw
    - stage-status
completion_rules:
  - 安全 raw 结果、正式报告和缺陷清单或未执行说明均已落盘。
status_rules:
  blocked: 评审版安全用例缺失，或安全 gate 不满足。
  not_ready: 安全正式产物未完整生成。
  needs_update: 正式产物未引用当前批次。
  completed: 安全阶段产物完整。
entrypoints:
  script_ps1: scripts/run-security-tests.ps1
  script_sh: scripts/run-security-tests.sh
  checker: scripts/check-stage.ps1
