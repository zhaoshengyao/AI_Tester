stage_id: 10-knowledge-base
display_name: 10.测试知识沉淀（增量追加）
driver_type: skill
required_inputs:
  - name: system-report
    paths:
      - docs/test-runs/{run_id}/reports/系统测试报告.md
    match: all
    path_type: file
  - name: batch-summary
    paths:
      - docs/test-runs/{run_id}/批次摘要.md
    match: all
    path_type: file
required_outputs:
  - name: knowledge-main
    paths:
      - docs/knowledge/测试知识库.md
    match: all
    path_type: file
    must_reference_run_id: true
  - name: knowledge-indexes
    paths:
      - docs/knowledge/需求变更影响索引.md
      - docs/knowledge/回归测试资产索引.md
      - docs/knowledge/缺陷模式库.md
      - docs/knowledge/自动化资产维护清单.md
      - docs/knowledge/环境与工具问题库.md
      - docs/knowledge/下一轮迭代测试建议.md
    match: any
    path_type: file
required_gates: []
archive_requirements:
  requires_run_archive: true
  required_subdirs:
    - reports
    - defects
    - raw
    - stage-status
completion_rules:
  - 每个专项完成后立即沉淀该专项相关知识，不等所有专项完成。
  - 已沉淀的知识索引文件存在且不为空。
  - 待确认信息标注"待确认"，不沉淀为确定结论。
status_rules:
  blocked: 当前批次摘要缺失。
  not_ready: 知识沉淀产物未开始生成。
  needs_update: 存在新的专项结果未沉淀到知识库中。
  completed: 所有已完成专项的知识已沉淀。
entrypoints:
  skill: knowledge-base
  checker: scripts/check-stage.ps1
