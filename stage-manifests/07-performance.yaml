stage_id: 7-performance
display_name: 7.性能测试
driver_type: script
required_inputs:
  - name: reviewed-performance-case
    paths:
      - docs/cases/性能测试用例-评审版.md
    match: all
    path_type: file
required_outputs:
  - name: performance-raw-report
    paths:
      - tests/performance/results
    match: all
    path_type: dir
  - name: performance-formal-report
    paths:
      - docs/test-runs/{run_id}/reports/性能测试报告.md
    match: all
    path_type: file
    must_reference_run_id: true
  - name: performance-defect-doc
    paths:
      - docs/test-runs/{run_id}/defects/性能缺陷清单.md
    match: all
    path_type: file
    must_reference_run_id: true
required_gates:
  - name: locust-and-parameter-gates
    gate_type: external
    description: Locust、压测参数和授权由脚本执行期校验。
archive_requirements:
  requires_run_archive: true
  required_subdirs:
    - reports
    - defects
    - raw
    - stage-status
completion_rules:
  - 性能 raw 结果、正式报告和缺陷清单或未执行说明均已落盘。
status_rules:
  blocked: 评审版性能用例缺失，或性能 gate 不满足。
  not_ready: 性能正式产物未完整生成。
  needs_update: 正式产物未引用当前批次。
  completed: 性能阶段产物完整。
entrypoints:
  script_ps1: scripts/run-perf-tests.ps1
  script_sh: scripts/run-perf-tests.sh
  checker: scripts/check-stage.ps1
