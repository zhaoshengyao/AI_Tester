stage_id: 6-ui-automation
display_name: 6.UI自动化
driver_type: script
required_inputs:
  - name: reviewed-ui-case
    paths:
      - projects/{system}/docs/cases/功能测试用例-评审版.md
    match: all
    path_type: file
required_outputs:
  - name: ui-raw-report
    paths:
      - projects/{system}/tests/ui/reports
    match: all
    path_type: dir
  - name: ui-coverage-matrix
    paths:
      - projects/{system}/test-runs/{run_id}/reports/UI自动化覆盖矩阵.md
    match: all
    path_type: file
    must_reference_run_id: true
  - name: ui-formal-report
    paths:
      - projects/{system}/test-runs/{run_id}/reports/UI自动化测试报告.md
    match: all
    path_type: file
    must_reference_run_id: true
  - name: ui-compat-report
    paths:
      - projects/{system}/test-runs/{run_id}/reports/UI兼容性测试报告.md
    match: all
    path_type: file
    must_reference_run_id: true
  - name: ui-defect-doc
    paths:
      - projects/{system}/test-runs/{run_id}/defects/UI缺陷清单.md
    match: all
    path_type: file
    must_reference_run_id: true
required_gates:
  - name: service-browser-gates
    gate_type: external
    description: 前端可达、浏览器可用、API 未出现连接级阻断由脚本执行期校验。
archive_requirements:
  requires_run_archive: true
  required_subdirs:
    - reports
    - defects
    - raw
    - stage-status
completion_rules:
  - UI raw 结果、正式报告、兼容性报告和缺陷清单或未执行说明均已落盘。
status_rules:
  blocked: 评审版功能用例或覆盖矩阵缺失，或 UI 执行 gate 不满足。
  not_ready: UI 自动化正式产物未完整生成。
  needs_update: 正式产物未引用当前批次。
  completed: UI 自动化阶段产物完整。
entrypoints:
  script_ps1: scripts/run-ui-tests.ps1
  script_sh: scripts/run-ui-tests.sh
  checker: scripts/check-stage.ps1
