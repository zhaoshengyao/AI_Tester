version: 1
required_top_level_keys:
  - stage_id
  - display_name
  - driver_type
  - required_inputs
  - required_outputs
  - required_gates
  - archive_requirements
  - completion_rules
  - status_rules
  - entrypoints
allowed_driver_types:
  - skill
  - script
  - hybrid
allowed_check_modes:
  - preflight
  - full
requirement_group_keys:
  - name
  - paths
  - match
  - path_type
allowed_match_values:
  - any
  - all
allowed_path_types:
  - file
  - dir
  - file_or_dir
gate_types:
  - file_exists
  - dir_exists
  - external
status_values:
  - ready
  - blocked
  - not_ready
  - needs_update
  - completed
# 路径占位符：{run_id} 由 check-stage --run-id 解析；{system} 由 --system 或 TEST_SYSTEM_ID 解析
# 第一步：run_id 已含 system 标识（格式 {ts}-{system}-{uuid}），manifest 路径保持 docs/test-runs/{run_id}/...
# 第二步：拆 projects/ 后，manifest 路径改为 projects/{system}/docs/...
allowed_path_placeholders:
  - "{run_id}"
  - "{system}"
