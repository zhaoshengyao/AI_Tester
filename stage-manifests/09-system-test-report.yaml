stage_id: 9-system-test-report
display_name: 9.系统测试报告（增量追加）
driver_type: skill
required_inputs:
  - name: batch-summary
    paths:
      - docs/test-runs/{run_id}/批次摘要.md
    match: all
    path_type: file
  - name: execution-reports
    paths:
      - docs/test-runs/{run_id}/reports/接口自动化测试报告.md
      - docs/test-runs/{run_id}/reports/UI自动化测试报告.md
      - docs/test-runs/{run_id}/reports/UI兼容性测试报告.md
      - docs/test-runs/{run_id}/reports/性能测试报告.md
      - docs/test-runs/{run_id}/reports/安全测试报告.md
    match: any
    path_type: file
required_outputs:
  - name: system-report
    paths:
      - docs/test-runs/{run_id}/reports/系统测试报告.md
    match: all
    path_type: file
    must_reference_run_id: true
required_gates: []
archive_requirements:
  requires_run_archive: true
  required_subdirs:
    - reports
    - defects
    - raw
    - stage-status
completion_rules:
  - 系统测试报告存在且引用当前批次，已执行专项有记录、未执行专项标注原因。
  - 每个专项完成后增量更新，不等所有专项完成。
status_rules:
  blocked: 当前批次摘要缺失。
  not_ready: 系统测试报告未生成。
  needs_update: 存在新的专项报告未增量追加到系统测试报告中。
  completed: 系统测试报告已包含当前所有已完成专项的记录。
entrypoints:
  skill: system-test-report
  checker: scripts/check-stage.ps1
