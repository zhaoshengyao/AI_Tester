# CRM 客户关系管理系统 - 通用描述文件
id: crm
name: CRM 客户关系管理系统

protocols:
  default:
    type: http
    config:
      base_url: "http://192.168.2.97:6089"
      api_base_path: "/prod-api"
      timeout: 30

auth:
  type: oauth2
  config:
    grant_type: password
    client_id: "e5cd7e4891bf95d1d19206ce24a7b32e"
    login_path: "/prod-api/system/login"
    token_field: "access_token"
    token_type: "Bearer"
    username_field: "username"
    password_field: "password"
    password_encryption: "aes-256-gcm"

test_scope:
  api:
    enabled: true
  ui:
    enabled: true
  performance:
    enabled: true
  security:
    enabled: true

paths:
  test_cases: "docs/cases"
  test_data: "tests/data"
  env_file: ".env"
  output_dir: "docs/test-runs"
